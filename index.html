<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan B"><meta name="theme-color" content="#060a14">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="splash.png">
<title>Plan B</title><style>
@font-face{font-family:"Orb";src:url(fonts/Orbitron.ttf) format("truetype");font-weight:400 900;font-display:swap}
:root{--bg:#060a14;--glass:rgba(18,28,48,.55);--line:rgba(120,220,255,.18);--cy:#22e6ff;--vi:#a78bfa;--tx:#e6f1ff;--mut:#7f93b3;--red:#ff4d6d;--grn:#5cffb0;
--hd:"Orb","Rajdhani","Avenir Next",system-ui,sans-serif;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--tx);font:16px/1.45 var(--sans);min-height:100vh;padding:0 env(safe-area-inset-right) calc(96px + env(safe-area-inset-bottom)) env(safe-area-inset-left);background:var(--bg)}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
.bgg{position:fixed;inset:0;z-index:-2;background:radial-gradient(80% 50% at 85% 0%,#1a2b5a66,transparent 70%),radial-gradient(60% 40% at 0% 100%,#3b1d6a44,transparent 70%),
linear-gradient(rgba(34,230,255,.05) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(34,230,255,.05) 1px,transparent 1px) 0 0/32px 32px,var(--bg);animation:grid 18s linear infinite}
@keyframes grid{to{background-position:0 0,0 0,0 32px,32px 0,0 0}}
.bgg:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 3px,rgba(255,255,255,.018) 3px 4px)}
header{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 18px 12px;display:flex;align-items:center;gap:12px;background:linear-gradient(#060a14f0,#060a14aa);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;flex:none;filter:drop-shadow(0 0 6px #22e6ff99)}
header h1{margin:0;font:800 20px var(--hd);letter-spacing:4px;line-height:1}
header small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw;font:600 11px var(--sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-top:4px}
header small b{color:var(--cy)}
.live{margin-left:auto;white-space:nowrap;flex-shrink:0;font:700 9px var(--hd);letter-spacing:1px;color:var(--grn);display:flex;align-items:center;gap:6px}
.live.off{color:var(--cy)}.live.off:before{background:var(--cy);box-shadow:0 0 8px var(--cy)}
.sys{padding:14px 16px;margin-top:14px;font-size:13px;color:#cfdcf0}.sys b{font-family:var(--hd);letter-spacing:2px;color:var(--cy)}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
main{padding:16px 14px}
.k{font:600 10.5px var(--hd);letter-spacing:2.5px;text-transform:uppercase;color:var(--mut)}
.glass{position:relative;background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 50px -24px #000,inset 0 1px rgba(255,255,255,.06)}
@keyframes in{from{opacity:0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.anim>*{animation:in .5s cubic-bezier(.2,.8,.2,1) both}.anim>*:nth-child(2){animation-delay:.06s}.anim>*:nth-child(3){animation-delay:.12s}.anim>*:nth-child(4){animation-delay:.18s}.anim>*:nth-child(n+5){animation-delay:.24s}
/* protocol */
.proto{padding:22px 18px 18px;overflow:hidden}
.br{position:absolute;width:22px;height:22px;border:2px solid var(--cy);filter:drop-shadow(0 0 4px var(--cy))}
.br.a{top:8px;left:8px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}.br.b{top:8px;right:8px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.br.c{bottom:8px;left:8px;border-right:0;border-top:0;border-radius:0 0 0 6px}.br.d{bottom:8px;right:8px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.phead{display:flex;justify-content:space-between;align-items:center}
.lvl{font:700 11px var(--hd);letter-spacing:2px;color:var(--vi);border:1px solid #a78bfa66;padding:5px 10px;border-radius:99px;background:#a78bfa14}
.big{font:900 96px/0.9 var(--hd);margin:10px 0 0;color:#e9fdff;text-shadow:0 0 18px #22e6ffaa,0 0 42px #22e6ff55;letter-spacing:-2px}
.big span{font-size:14px;letter-spacing:3px;color:var(--cy);vertical-align:top;margin-right:8px;text-shadow:none}
.ptitle{font:800 26px var(--hd);letter-spacing:4px;margin:4px 0 0;color:var(--tx)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.chip{font:600 11px var(--sans);padding:6px 10px;border-radius:8px;background:rgba(34,230,255,.07);border:1px solid var(--line);color:#bfefff;display:flex;align-items:center;gap:6px}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--cy);box-shadow:0 0 6px var(--cy)}.chip.v i{background:var(--vi);box-shadow:0 0 6px var(--vi)}.chip.g i{background:var(--grn);box-shadow:0 0 6px var(--grn)}
.sect{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}.sect p{margin:6px 0 0;color:#cfdcf0}
.scan{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent,rgba(34,230,255,.35) 48%,#fff 50%,rgba(34,230,255,.35) 52%,transparent);height:30%;animation:scan 1.1s ease-in-out 2 both}
@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(420%)}}
.sync{margin-top:18px;text-align:center;font:800 15px var(--hd);letter-spacing:3px;color:var(--grn);padding:14px;border:1px solid #5cffb066;border-radius:12px;background:#5cffb010;text-shadow:0 0 10px #5cffb0}
.sync.go{animation:in .6s 1.2s both}
/* buttons */
button{font:700 15px var(--sans);min-height:50px;border-radius:14px;border:0;padding:0 18px;cursor:pointer;transition:transform .08s,box-shadow .15s,filter .15s;color:var(--tx)}
button:active{transform:scale(.97);filter:brightness(1.2)}
.btn{width:100%;margin-top:18px;background:linear-gradient(90deg,#16c8ff,#22e6ff);color:#02121a;letter-spacing:1px;text-transform:uppercase;font-family:var(--hd);font-size:13px;box-shadow:0 0 0 1px #9ff4ff inset,0 0 24px #22e6ff66}
.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1}
/* orbit levels */
.orbit{position:relative;padding:4px 0 4px 6px}
.orbit:before{content:"";position:absolute;left:33px;top:34px;bottom:34px;width:2px;background:linear-gradient(var(--cy),rgba(34,230,255,.1) 30%,rgba(120,150,200,.15))}
.node{position:relative;display:flex;gap:16px;align-items:center;margin-bottom:16px}
.dot{width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;font:800 20px var(--hd);background:#0b1222;border:1px solid var(--line);color:var(--mut);z-index:1}
.node.on .dot{color:#02121a;background:radial-gradient(circle,#c8faff,#22e6ff 60%);border-color:#bff7ff;box-shadow:0 0 0 7px rgba(34,230,255,.12),0 0 0 14px rgba(34,230,255,.05),0 0 30px #22e6ff}
.node .box{flex:1;padding:12px 14px}.node.lock{opacity:.45}
.node h3{margin:3px 0 0;font:700 15px var(--hd);letter-spacing:1px;line-height:1.3}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vi),var(--cy));box-shadow:0 0 10px var(--cy)}
/* modules */
.mod{padding:14px 16px;margin-bottom:12px}
.mod.due{border-color:#ff4d6d99;box-shadow:0 0 0 1px #ff4d6d55,0 0 24px -6px #ff4d6d}
.mod h3{margin:0;font:700 15px var(--hd);letter-spacing:1px;display:flex;justify-content:space-between;gap:8px;align-items:center;line-height:1.3}
.led{display:flex;align-items:center;gap:7px;font:700 10px var(--hd);letter-spacing:1.5px;text-transform:uppercase;color:var(--sc);white-space:nowrap}
.led:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--sc);box-shadow:0 0 8px var(--sc),0 0 2px #fff inset}
.alert{display:inline-block;margin-top:8px;font:700 10px var(--hd);letter-spacing:1.5px;color:var(--red);border:1px solid #ff4d6d77;background:#ff4d6d14;padding:4px 8px;border-radius:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:10px 0 4px;font-size:14px}
.grid div span{display:block;font:600 9.5px var(--hd);letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-bottom:1px}
.batt{display:flex;align-items:center;gap:8px;margin-top:8px;font:600 11px var(--hd);color:var(--mut)}
.batt b{flex:1;height:10px;border:1px solid var(--line);border-radius:3px;padding:1px;position:relative}.batt b:after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:var(--line)}
.batt b i{display:block;height:100%;border-radius:2px;background:var(--bc);box-shadow:0 0 8px var(--bc)}
.mod .row button{min-height:42px;font-size:14px}
.empty{text-align:center;padding:34px 20px;margin-top:14px}
.empty svg{width:84px;filter:drop-shadow(0 0 10px #22e6ff88)}.empty h3{font:800 17px var(--hd);letter-spacing:3px;margin:14px 0 8px}.empty p{color:var(--mut);margin:0;font-style:italic}
.form{padding:18px}
label{display:block;margin:12px 0 5px;font:600 10px var(--hd);letter-spacing:1.8px;text-transform:uppercase;color:var(--mut)}
input,select{width:100%;font:16px var(--sans);min-height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(4,8,18,.7);color:var(--tx);padding:0 12px;-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px #22e6ff33}
/* gauge */
.gauge{text-align:center;padding:20px 12px 22px}
.ring{position:relative;width:230px;height:230px;margin:10px auto 6px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-content:center}.ring .n b{font:900 64px/1 var(--hd);text-shadow:0 0 20px #22e6ffaa}.ring .n span{font:600 10px var(--hd);letter-spacing:2px;color:var(--mut);margin-top:6px}
.tier{font:800 20px var(--hd);letter-spacing:3px;color:var(--cy);text-shadow:0 0 14px #22e6ff88}
.tiers{margin-top:14px;display:grid;gap:8px}
.tiers div{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-radius:12px;font:600 12px var(--hd);letter-spacing:1px;color:var(--mut)}
.tiers div.cur{border-color:var(--cy);color:var(--tx);box-shadow:0 0 18px -6px var(--cy)}
.note{font-size:13px;color:var(--mut);margin-top:14px;line-height:1.5}
nav{position:fixed;z-index:9;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;background:rgba(10,16,30,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 14px 40px -10px #000,0 0 30px -18px var(--cy)}
nav button{flex:1;background:none;color:var(--mut);min-height:58px;border-radius:18px;padding:0;font:600 9.5px var(--hd);letter-spacing:1px;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
nav svg{width:23px;height:23px}
nav button.on{color:var(--cy);background:rgba(34,230,255,.09);box-shadow:inset 0 0 0 1px rgba(34,230,255,.3)}nav button.on svg{filter:drop-shadow(0 0 6px var(--cy))}
dialog{background:rgba(12,20,36,.92);backdrop-filter:blur(20px);color:var(--tx);border:1px solid #22e6ff66;border-radius:20px;max-width:min(92vw,420px);width:92vw;padding:18px;box-shadow:0 30px 80px #000,0 0 40px -10px var(--cy)}
dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}
dialog h2{font:700 16px var(--hd);letter-spacing:1.5px;margin:0 0 10px;color:var(--cy)}
dialog .grid{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
header>div:not(.live){min-width:0;flex:1}</style></head><body>
<div class="bgg"></div><canvas id="fx"></canvas>
<header><svg class="logo" viewBox="0 0 64 64" fill="none"><path d="M32 4l24 14v28L32 60 8 46V18z" stroke="#22e6ff" stroke-width="3"/><text x="32" y="40" text-anchor="middle" font-family="Orb,sans-serif" font-weight="900" font-size="22" fill="#e6f1ff">B</text></svg>
<div><h1>PLAN B</h1><small id="sub"></small></div><div class="live" id="net" title="Funciona sin conexión">OFFLINE-READY</div></header>
<main id="v"></main>
<nav>
<button data-t="m"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><circle cx="12" cy="12" r="3.5"/></svg>Misión</button>
<button data-t="n"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="2.5"/><ellipse cx="12" cy="12" rx="9.5" ry="4.5" transform="rotate(-30 12 12)"/><circle cx="19" cy="6.5" r="1.6" fill="currentColor"/></svg>Niveles</button>
<button data-t="r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>Registro</button>
<button data-t="p"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a9 9 0 109 9"/><path d="M12 7a5 5 0 105 5"/><path d="M12 12l7-7"/></svg>Puntuación</button>
</nav>
<dialog id="dlg"><div id="dlgb"></div><div class="row" style="margin-top:14px"><button class="ghost" id="dn">No</button><button class="btn" style="margin:0" id="dy">Sí</button></div></dialog>
<script src="app.js"></script></body></html>
